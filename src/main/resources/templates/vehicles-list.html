<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản Lý Xe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h3 class="card-title">Danh Sách Xe</h3>
                    <div class="btn-group">
                        <a href="/admin/dashboard" class="btn btn-secondary me-2">
                            <i class="bi bi-arrow-left"></i> Quay Lại Dashboard
                        </a>
                        <a href="/admin/vehicles/new" class="btn btn-primary">
                            <i class="bi bi-plus-circle"></i> Thêm Xe Mới
                        </a>
                    </div>
                </div>
                <div class="card-body">
                    <table class="table table-striped table-hover">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tên Xe</th>
                            <th>Biển Số</th>
                            <th>Danh Mục</th>
                            <th>Giá Thuê/Ngày</th>
                            <th>Trạng Thái</th>
                            <th>Hành Động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="vehicle : ${vehicles}">
                            <td th:text="${vehicle.id}">ID</td>
                            <td th:text="${vehicle.name}">Tên Xe</td>
                            <td th:text="${vehicle.licensePlate}">Biển Số</td>
                            <td th:text="${vehicle.categories.nameCategory}">Danh Mục</td>
                            <td th:text="${#numbers.formatInteger(vehicle.price, 0, 'POINT')} + ' VND'">Giá Thuê</td>
                            <td>
                                <span th:switch="${vehicle.status}" class="badge">
                                    <span th:case="'AVAILABLE'" class="bg-success">Sẵn Sàng</span>
                                    <span th:case="'RENTED'" class="bg-warning text-dark">Đang Thuê</span>
                                    <span th:case="'MAINTENANCE'" class="bg-secondary">Bảo Dưỡng</span>
                                </span>
                            </td>
                            <td>
                                <div class="btn-group">
                                    <a th:href="@{/admin/vehicles/edit/{id}(id=${vehicle.id})}"
                                       class="btn btn-sm btn-warning me-1">
                                        <i class="bi bi-pencil"></i> Sửa
                                    </a>
                                    <a th:href="@{/admin/vehicles/delete/{id}(id=${vehicle.id})}"
                                       class="btn btn-sm btn-danger"
                                       onclick="return confirm('Bạn có chắc chắn muốn xóa xe này?')">
                                        <i class="bi bi-trash"></i> Xóa
                                    </a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">Tổng Số Xe</div>
                <div class="card-body">
                    <h3 th:text="${vehicles.size()}">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">Xe Sẵn Sàng</div>
                <div class="card-body">
                    <h3 th:text="${availableVehiclesCount}">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">Tổng Doanh Thu Dự Kiến</div>
                <div class="card-body">
                    <h3 th:text="${#numbers.formatInteger(totalExpectedRevenue, 0, 'POINT')} + ' VND'">0 VND</h3>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
